[project]
name = "hrd-forum-website"
version = "1.0.0"
requires-python = ">=3.9"
description = "HRD Forum Nepal public website and staff portal"
dependencies = [
  "Django>=4.2.19,<5.0",
  "asgiref>=3.7.0",
  "sqlparse>=0.4.4",
  "dj-database-url>=2.1.0",
  "psycopg2-binary>=2.9.9",
  "djangorestframework>=3.14.0",
  "djangorestframework-simplejwt>=5.3.0",
  "django-cors-headers>=4.3.0",
  "django-filter>=23.5",
  "django-cloudinary-storage>=0.3.0",
  "cloudinary>=1.36.0",
  "django-storages[s3]>=1.14.0",
  "boto3>=1.34.0",
  "Pillow>=10.0.0",
  "whitenoise>=6.5.0",
  "gunicorn>=21.2.0",
  "python-dotenv>=1.0.0",
  "requests>=2.31.0",
  "python-dateutil>=2.8.2",
  "PyJWT>=2.8.0",
]

[tool.vercel]
entrypoint = "hrd_project.wsgi:application"
