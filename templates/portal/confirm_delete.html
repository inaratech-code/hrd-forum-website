{% extends "portal/base_portal.html" %}

{% block title %}Confirm Delete | HRD Forum Portal{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-xl p-8 text-center space-y-6">
        <div class="w-16 h-16 bg-red-100 text-red-600 rounded-2xl flex items-center justify-center text-2xl mx-auto font-bold">
            <i class="fas fa-exclamation-triangle"></i>
        </div>

        <div class="space-y-2">
            <h1 class="text-xl font-extrabold text-slate-900">Delete {{ item_type|default:"Item" }}?</h1>
            <p class="text-xs text-slate-500 font-medium">Are you sure you want to permanently delete <strong class="text-slate-800">"{{ item_title }}"</strong>? This action cannot be undone.</p>
        </div>

        <form method="POST" class="flex items-center justify-center space-x-3 pt-4">
            {% csrf_token %}
            <a href="{% url cancel_url|default:'portal_gallery_list' %}" class="px-5 py-3 rounded-xl border border-slate-200 text-slate-700 font-bold text-xs hover:bg-slate-100 transition">
                Cancel
            </a>
            <button type="submit" class="px-6 py-3 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold text-xs shadow-lg shadow-red-600/20 transition flex items-center space-x-2">
                <i class="fas fa-trash-alt"></i>
                <span>Yes, Delete Now</span>
            </button>
        </form>
    </div>
</div>
{% endblock %}
