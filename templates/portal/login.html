{% extends "portal/base_portal.html" %}

{% block title %}Portal Login | HRD Forum Nepal{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-12">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-xl p-8 space-y-6">
        <div class="text-center space-y-2">
            <div class="w-14 h-14 bg-teal-600/10 border border-teal-600/20 text-teal-700 rounded-2xl flex items-center justify-center text-2xl mx-auto font-bold">
                <i class="fas fa-user-shield"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-navy-900">Staff Portal Login</h1>
            <p class="text-sm text-slate-500 font-medium">Access HRD Forum Nepal Management Hub</p>
        </div>

        <form method="POST" action="{% url 'portal_login' %}" class="space-y-4">
            {% csrf_token %}
            {% if request.GET.next %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">
            {% endif %}

            <div>
                <label class="block text-xs font-bold uppercase text-slate-600 tracking-wider mb-2">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 text-sm">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" name="username" required autofocus placeholder="Enter staff username..."
                           class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 outline-none transition font-medium text-sm text-slate-900">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-slate-600 tracking-wider mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 text-sm">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" name="password" required placeholder="Enter password..."
                           class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:border-teal-600 focus:ring-2 focus:ring-teal-600/20 outline-none transition font-medium text-sm text-slate-900">
                </div>
            </div>

            <button type="submit" class="w-full py-3.5 bg-teal-700 hover:bg-teal-800 text-white font-bold rounded-xl shadow-lg shadow-teal-700/20 transition flex items-center justify-center space-x-2 text-sm">
                <span>Sign In to Dashboard</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="text-center pt-4 border-t border-slate-100">
            <span class="text-xs text-slate-400">Authorized Personnel & Network Staff Only</span>
        </div>
    </div>
</div>
{% endblock %}
