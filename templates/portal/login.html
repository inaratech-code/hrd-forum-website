{% extends "portal/base_portal.html" %}

{% block title %}Portal Login | HRD Forum{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center p-4">
    <div class="w-full max-w-[400px] bg-white rounded-2xl border border-slate-200 p-8 space-y-6">
        
        <div class="text-center flex flex-col items-center">
            <div class="w-12 h-12 rounded-xl bg-blue-600 flex items-center justify-center text-white mb-3 shadow-sm">
                <i class="fas fa-shield-alt text-[20px]"></i>
            </div>
            <p class="font-mono text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-1">Management Hub</p>
            <h1 class="font-sans text-[24px] font-semibold text-slate-900">Sign in to Portal</h1>
        </div>

        <form method="POST" action="{% url 'portal_login' %}" class="space-y-5">
            {% csrf_token %}
            {% if request.GET.next %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">
            {% endif %}

            <div class="space-y-1.5">
                <label class="block font-mono text-[11px] font-bold text-slate-500 uppercase tracking-wider">Username</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400">
                        <i class="fas fa-user text-[13px]"></i>
                    </span>
                    <input type="text" name="username" required autofocus placeholder="Enter username"
                           class="w-full pl-9 pr-4 py-2.5 rounded-lg border border-slate-200 focus:border-blue-600 focus:ring-1 focus:ring-blue-600 outline-none transition text-[13px] text-slate-900 placeholder:text-slate-400 bg-slate-50 focus:bg-white">
                </div>
            </div>

            <div class="space-y-1.5">
                <label class="block font-mono text-[11px] font-bold text-slate-500 uppercase tracking-wider">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400 pointer-events-none">
                        <i class="fas fa-lock text-[13px]"></i>
                    </span>
                    <input type="password" name="password" required placeholder="Enter password"
                           class="w-full pl-9 pr-10 py-2.5 rounded-lg border border-slate-200 focus:border-blue-600 focus:ring-1 focus:ring-blue-600 outline-none transition text-[13px] text-slate-900 placeholder:text-slate-400 bg-slate-50 focus:bg-white"
                           autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg transition flex items-center justify-center gap-2 text-[13px] pt-2.5 pb-2.5">
                <span>Sign In</span>
                <i class="fas fa-arrow-right text-[12px]"></i>
            </button>
        </form>

        <div class="text-center pt-5 border-t border-slate-100">
            <span class="font-mono text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Authorized Personnel Only</span>
        </div>
    </div>
</div>
{% endblock %}
